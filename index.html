<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小智 · 语音播报</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#">小智 <span>VOICE NOTE</span></a>
        <div class="status" id="status" aria-live="polite"><i></i> 准备就绪</div>
      </header>

      <section class="hero">
        <p class="eyebrow">TEXT TO SPEECH / 01</p>
        <h1>让每一段文字，<br /><em>被好好听见。</em></h1>
        <p class="intro">输入你想传达的内容，选择合适的声音，即刻开始自然流畅的语音播报。</p>
      </section>

      <section class="studio" aria-label="语音播报控制台">
        <div class="editor-panel">
          <div class="panel-heading">
            <label for="text-input">播报文稿</label>
            <span id="count">0 字</span>
          </div>
          <textarea id="text-input" maxlength="10000" placeholder="在这里输入想要播报的文字…">欢迎使用小智语音播报系统。输入一段文字，选择你喜欢的声音和语速，点击开始播报，即可聆听完整内容。</textarea>
          <div class="editor-footer">
            <button class="text-button" id="clear-btn" type="button">清空内容</button>
            <span>支持最长 10,000 字</span>
          </div>
        </div>

        <aside class="control-panel">
          <div class="control-group">
            <div class="label-row"><label for="voice-select">千问播报声音</label><span class="tag">QWEN REALTIME</span></div>
            <div class="voice-filters" role="group" aria-label="声音类型筛选">
              <button class="filter-button active" type="button" data-filter="male">男声优先</button>
              <button class="filter-button" type="button" data-filter="sichuan">四川话</button>
              <button class="filter-button" type="button" data-filter="female">女声</button>
              <button class="filter-button" type="button" data-filter="custom">我的复刻</button>
              <button class="filter-button" type="button" data-filter="all">全部</button>
            </div>
            <select id="voice-select" aria-label="选择播报声音"></select>
            <button class="preview-button" id="preview-btn" type="button">试听当前声音 <span>↗</span></button>
            <button class="clone-toggle" id="clone-toggle" type="button">+ 创建专属复刻音色</button>
            <form class="clone-panel hidden" id="clone-form">
              <label for="clone-name">音色名称</label>
              <input id="clone-name" maxlength="24" placeholder="例如：宣传女声" required />
              <label for="clone-audio">样音文件（WAV / MP3 / M4A，建议 10–20 秒）</label>
              <input id="clone-audio" type="file" accept="audio/wav,audio/mpeg,audio/mp4,audio/x-m4a,.wav,.mp3,.m4a" required />
              <label class="consent"><input id="clone-consent" type="checkbox" required /> 我确认已获得声音主体的明确授权，可将该样音上传至阿里云百炼用于声音复刻。</label>
              <button class="clone-submit" type="submit">创建专属音色</button>
              <p class="clone-message" id="clone-message"></p>
            </form>
          </div>

          <div class="control-group">
            <div class="label-row"><label for="rate">播报速度</label><output id="rate-value" for="rate">1.0×</output></div>
            <input id="rate" type="range" min="0.5" max="2" step="0.1" value="0.9" />
            <div class="range-labels"><span>舒缓</span><span>标准</span><span>快速</span></div>
          </div>

          <div class="control-group compact-control">
            <div class="label-row"><label for="pitch">音调</label><output id="pitch-value" for="pitch">标准</output></div>
            <input id="pitch" type="range" min="0.5" max="1.5" step="0.1" value="0.9" />
          </div>

          <div class="action-row">
            <button class="play-button" id="play-btn" type="button"><span class="play-icon">▶</span><span>开始播报</span></button>
            <button class="icon-button" id="stop-btn" type="button" title="停止播报" aria-label="停止播报">■</button>
          </div>
          <p class="hint" id="support-hint">正在检查浏览器语音服务…</p>
          <p class="natural-note">千问实时神经网络语音 · 24 kHz 音频流 · 自然播报指令已启用</p>
        </aside>
      </section>

      <footer>
        <span>VOICE BROADCAST DEMO</span>
        <span>Qwen TTS Realtime · API Key 仅保存在服务端</span>
      </footer>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
